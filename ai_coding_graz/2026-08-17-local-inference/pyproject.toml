[project]
name = "demo"
version = "1.0.0"
description = "Demo application for talk about local inference"
readme = "README.md"
authors = [
    { name = "Thomas Aglassinger", email = "roskakori@users.sourceforge.net" }
]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
build_demo_app = "demo.build_demo_app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ty>=0.0.72",
]
